<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        *{
            margin: 0;
            background-color: rgb(221, 221, 221);
        }

        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            
        }

        .container{
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            border: 2px black solid;
            
        }

        .botoes {
            display: flex;
            gap: 8px;
        }
        
        
    </style>
</head>
<body>
    <div class="container">
        <h1>Calculadora</h1>
        <label for="num1">Primeiro número:</label>
        <br>
        <input type="text" id="num1">
        <br>
        <label for="num2">Segundo número:</label>
        <br>
        <input type="text" id="num2">
        <br>

        <div class="botoes">
            <input type="button" name="" value="+" id="soma" onclick="identificarBotao(event)">
            <input type="button" name="" value="-" id="subtracao" onclick="identificarBotao(event)">
            <input type="button" name="" value="*" id="multiplicacao" onclick="identificarBotao(event)">
            <input type="button" name="" value="/" id="divisao" onclick="identificarBotao(event)">
        </div>

        <label for="resultado">Resultado:</label>
        <br>
        <input type="text" id="resultado">
    </div>
</body>
    <script src="script.js"></script>
</html>
