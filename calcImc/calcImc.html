<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculo IMC</title>
    <style>
        *{
            background-color: rgb(65, 124, 190);
            padding: auto;
            margin: 0;
        }

        .container-principal{
            display: grid;
            justify-content: center;
            padding: 10px;
            margin: 200px 200px;
            width: 20%;
        }
        input{
            background-color: aliceblue;
            border: none;
            border-radius: 10px;
            padding: 4px;
            font-size: 18px;
        }
        label{
            font-size: 18px;
        }
        button{
            border-radius: 20px;
            width: 300px;
            height: 30px;
            font-size: 18px;
        }
        button:hover{
            background-color: rgb(0, 68, 131);
            transition: 1.5s;
        }
        h1{
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container-principal">
        <label for="altura">Digite sua altura:</label>
        <input type="text" id="altura" placeholder="Ex: 1.75">
        <label for="peso">Digite seu peso:</label>
        <input type="text" id="peso" placeholder="Ex: 85.5" >
        <label for="sexo">Digite seu sexo:</label>
        <input type="text" id="sexo" placeholder="Ex: Feminino / Masculino">
        <br>
        <button onclick="calcImc()">Descubre seu peso ideal</button>
        <h1 id="resp"></h1>
    </div>
</body>
    <script src="Imc.js"></script>
</html>
